<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A bioluminescent garden that bends, branches and blooms toward the light you move across the screen." />
    <meta name="theme-color" content="#02050c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2302050c'/%3E%3Cpath d='M16 27V14M16 18c-4-1-6-4-6-8 4 1 6 4 6 8zM16 15c3-1 5-3 5-7-3 1-5 3-5 7z' fill='none' stroke='%235ff5d0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Noctiflora · phototropic garden</title>
  </head>
  <body>
    <canvas id="garden" tabindex="0" role="img" aria-label="A garden of glowing plants growing toward a moving light. Move the pointer to guide the light, click or tap to sow a seed. Arrow keys move the light, Enter sows."></canvas>

    <header class="title">
      <h1>Noctiflora</h1>
      <p id="hint" class="hint">Move the light and the plants lean after it. Click or tap to sow a seed.</p>
    </header>

    <nav class="dock" aria-label="Garden controls">
      <div class="group" role="group" aria-label="Species to sow">
        <button type="button" class="chip" data-species="mix" aria-pressed="true" title="Mixed seeds">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><circle cx="12" cy="16" r="3"/></svg>
          <span>Mixed</span>
        </button>
        <button type="button" class="chip" data-species="fern" aria-pressed="false" style="--c:#5ff5c8" title="Fern">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22C12 14 13 8 18 3M12 19l-5-3M12 16l5-3M12 13l-5-3M13 10l4-3M12.6 7.5L10 5"/></svg>
          <span>Fern</span>
        </button>
        <button type="button" class="chip" data-species="arbor" aria-pressed="false" style="--c:#ff9d7a" title="Lumen tree">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-9M12 13L7 8M12 13l5-5M7 8L5 4M7 8l3-4M17 8l2-4M17 8l-3-4"/></svg>
          <span>Lumen tree</span>
        </button>
        <button type="button" class="chip" data-species="lily" aria-pressed="false" style="--c:#ff59ad" title="Lily">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22V11M12 11C8 10 6 7 6 3c4 1 6 3 6 8zM12 11c4-1 6-4 6-8-4 1-6 3-6 8zM12 18c-3 0-5-2-6-4M12 16c3 0 5-2 6-4"/></svg>
          <span>Lily</span>
        </button>
        <button type="button" class="chip" data-species="vine" aria-pressed="false" style="--c:#59c9ff" title="Vine">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 22c6-3-2-7 3-11 3-2 2-5 0-6M11 11c3 0 5 1 6 3-2 1-5 0-6-3"/></svg>
          <span>Vine</span>
        </button>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <div class="group">
        <button type="button" class="chip" id="lapse" aria-pressed="false" title="Speed up growth">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 13V8M9 2h6"/></svg>
          <span>Time-lapse</span>
        </button>
        <button type="button" class="chip" id="reset" title="Clear the garden and start over">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>
          <span>Replant</span>
        </button>
      </div>
    </nav>

    <noscript><p class="nojs">This garden needs JavaScript to grow.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
